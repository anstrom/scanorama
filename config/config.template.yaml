# Scanorama Configuration Template
# Copy this file to config.yaml and customize as needed.
#
# Every key here is read by the Config struct (internal/config/config.go).
# TestShippedConfigsScanMode fails if this file gains a key nothing reads.
# For a production layout see deploy/config.example.yaml.

database:
  host: "localhost"
  port: 5432
  database: "scanorama"
  username: "scanorama"
  password: "your_secure_password_here"  # Change this!
  ssl_mode: "disable"                    # disable | require | verify-ca | verify-full
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

api:
  enabled: true
  host: "127.0.0.1"            # Bind address; 0.0.0.0 for all interfaces
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

  # Authentication is OFF unless auth_enabled is true. Set it and add keys
  # before exposing the API beyond localhost.
  auth_enabled: false
  api_keys: []

  enable_cors: true
  cors_origins:
    - "*"                      # In production, list your frontend origins

  rate_limit_enabled: true
  rate_limit_requests: 100     # Requests per rate_limit_window per client
  rate_limit_window: 1m

scanning:
  worker_pool_size: 10
  default_ports: "1-1000"
  scan_mode: connect           # connect needs no privilege; syn/ack/udp/aggressive/comprehensive need raw sockets
  max_scan_timeout: 10m
  max_concurrent_targets: 100
  enable_service_detection: true
  enable_os_detection: false

logging:
  level: info                  # debug | info | warn | error
  format: text                 # text | json
  output: stdout               # stdout | stderr | file path

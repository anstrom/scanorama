name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "internal/api/**"
      - "cmd/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
      - "**/*.go"
      - "tools/go.mod"
      - "tools/go.sum"
      - "Makefile"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "internal/api/**"
      - "cmd/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
      - "**/*.go"
      - "tools/go.mod"
      - "tools/go.sum"
      - "Makefile"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

permissions:
  contents: read
  checks: write
  pull-requests: write

# PR runs share a group per branch, so a new push cancels the superseded run.
# Every other run (main, tags, schedule, dispatch) gets a unique group via
# run_id: a shared group would still cancel queued runs during merge bursts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate OpenAPI syntax
        run: npm run docs:validate

      - name: Advanced OpenAPI linting
        run: npm run spectral:lint

      - name: Check schema compatibility
        run: npm run openapi:check-schema

      - name: Lint against redocly recommended rules
        run: npm run openapi:validate-for-codegen

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Go dependencies
        run: go mod download

      - name: Install Node dependencies
        run: npm install

      - name: Generate API documentation
        run: make docs

      - name: Check for swagger drift
        run: |
          if ! git diff --exit-code docs/swagger/ frontend/src/api/types.ts; then
            echo ""
            echo "❌ Swagger spec is out of sync with code annotations."
            echo "Run 'make docs' locally and commit the updated files:"
            echo "  docs/swagger/swagger.json"
            echo "  docs/swagger/swagger.yaml"
            echo "  docs/swagger/docs.go"
            echo "  frontend/src/api/types.ts"
            exit 1
          fi

      - name: Build HTML documentation
        run: npm run docs:build

      - name: Verify generated files
        run: |
          ls -la docs/swagger/
          test -f docs/swagger/swagger.yaml
          test -f docs/swagger/swagger.json
          test -f docs/swagger/docs.go

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          path: |
            docs/swagger/
            docs/*.md
          retention-days: 30

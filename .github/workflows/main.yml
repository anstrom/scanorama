name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# paths-filter lists PR files through the API, hence pull-requests: read.
permissions:
  contents: read
  pull-requests: read

# PR runs share a group per branch, so a new push cancels the superseded run.
# Every other run (main, tags, schedule, dispatch) gets a unique group via
# run_id: a shared group would still cancel queued runs during merge bursts.
# release.yml calls this workflow; do not give the caller the same group
# expression, or caller and callee would share a group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Stage 0: Detect which paths changed so downstream jobs can skip if irrelevant
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.frontend == 'true' }}
      docs: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Tag pushes (including release.yml's workflow_call, which inherits the
      # caller's ref) have no diff for paths-filter to inspect, so every filter
      # would report false and the release would ship without running tests.
      - name: Force full run for tags and manual dispatch
        id: force
        run: echo "all=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/db/**/*.sql'
              - 'test/fixtures/**'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            # Everything that can change the output of make docs.
            docs:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'docs/**'
              - 'tools/go.mod'
              - 'tools/go.sum'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'Makefile'
              - '.github/workflows/**'

  # Stage 1: Code Quality & Security (runs in parallel)
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not properly formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          skip-cache: false
          skip-save-cache: false

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Regenerates the OpenAPI spec and frontend types and fails if the committed
  # files differ. Lives here rather than in docs.yml so CI OK can require it.
  swagger-drift:
    name: Swagger Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Regenerate API documentation
        run: make docs

      - name: Check for swagger drift
        run: |
          if ! git diff --exit-code docs/swagger/ frontend/src/api/types.ts; then
            echo ""
            echo "::error::Swagger spec is out of sync with code annotations."
            echo "Run 'make docs' locally and commit the updated files:"
            echo "  docs/swagger/swagger.json"
            echo "  docs/swagger/swagger.yaml"
            echo "  docs/swagger/docs.go"
            echo "  frontend/src/api/types.ts"
            exit 1
          fi

  # Stage 2: Unit Tests (fast tests, no external dependencies)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nmap

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          go test -short -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          name: unit-coverage
          slug: anstrom/scanorama
          flags: unit
          fail_ci_if_error: false
          verbose: true

  # Frontend Tests: lint, type-check, build and test; runs in parallel with unit tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run linter
        run: npm run lint --prefix frontend

      - name: Type-check and build
        run: npm run build --prefix frontend

      - name: Run tests
        run: npm test --prefix frontend

  # Stage 3a: Integration Tests — no external services required
  # Packages: auth, daemon, scheduler, workers, scanning, discovery,
  #           api/handlers, and everything else that only needs nmap.
  # Runs in parallel with integration-tests-services, using -p 4 since
  # there is no shared database to contend over.
  integration-tests-nodb:
    name: Integration Tests (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in parallel with Unit Tests rather than after it; CI OK still
    # requires both, so a unit failure blocks the merge either way.
    needs: [changes]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nmap

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests (no services)
        run: |
          # Exclude the e2e test package which requires postgres/redis/nmap services.
          # All other packages are self-contained and safe to run in parallel.
          go test -v -p 4 -tags=integration -coverprofile=coverage_nodb.out -covermode=atomic \
            $(go list ./... | grep -v 'github.com/anstrom/scanorama/test$')
          go tool cover -func=coverage_nodb.out | tail -1

      - name: Upload no-services coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-nodb
          path: coverage_nodb.out
          retention-days: 1

  # Stage 3b: Integration Tests — requires database and network services
  # Packages: test (e2e scans against real postgres + nginx + ssh containers)
  # Runs in parallel with integration-tests-nodb.
  integration-tests-services:
    name: Integration Tests (services)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in parallel with Unit Tests rather than after it; CI OK still
    # requires both, so a unit failure blocks the merge either way.
    needs: [changes]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nginx:
        image: nginx:alpine
        ports:
          - 8080:80
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      ssh:
        image: lscr.io/linuxserver/openssh-server:version-10.3_p1-r1
        ports:
          - 8022:2222
        env:
          PUID: 1000
          PGID: 1000
          PASSWORD_ACCESS: true
          USER_PASSWORD: testpass
          USER_NAME: testuser
        # No container health check: the "Wait for services" step waits for
        # sshd's banner via ssh-keyscan, which is the readiness that matters.

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: scanorama_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: scanorama_test
      TEST_DB_USER: scanorama_test_user
      TEST_DB_PASSWORD: test_password_123
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nmap

      - name: Wait for services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-tools wget
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping | grep -q PONG; do sleep 1; done'
          timeout 30 bash -c 'until wget --quiet --tries=1 --spider http://localhost:8080; do sleep 1; done'
          # nc -z would pass as soon as Docker's port proxy listens; ssh-keyscan
          # needs sshd itself to answer.
          timeout 60 bash -c 'until ssh-keyscan -p 8022 localhost >/dev/null 2>&1; do sleep 1; done'

      - name: Create test database and user
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE USER scanorama_test_user WITH PASSWORD 'test_password_123';" || echo "User may already exist"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE scanorama_test OWNER scanorama_test_user;" || echo "Database may already exist"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE scanorama_test TO scanorama_test_user;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d scanorama_test -c "GRANT ALL ON SCHEMA public TO scanorama_test_user;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d scanorama_test -c "GRANT CREATE ON SCHEMA public TO scanorama_test_user;"
          PGPASSWORD=test_password_123 psql -h localhost -U scanorama_test_user -d scanorama_test -c "SELECT 1;" > /dev/null && echo "✅ Test database is ready"

      - name: Run integration tests (services)
        run: |
          # Run sequentially (-p 1) so internal/db and internal/scanning tests
          # don't race over the shared postgres instance.
          # The test package uses TestMain (single migration) + t.Parallel() +
          # nmapMu so tests are safe to run concurrently within the package.
          go test -v -p 1 -tags=integration -coverprofile=coverage_services.out -covermode=atomic \
            github.com/anstrom/scanorama/test \
            github.com/anstrom/scanorama/internal/db \
            github.com/anstrom/scanorama/internal/scanning
          go tool cover -func=coverage_services.out | tail -1

      - name: Upload services coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-services
          path: coverage_services.out
          retention-days: 1

  # Stage 4: Merge coverage and upload to Codecov
  # Waits for both integration jobs, then merges their profiles and uploads.
  coverage-merge:
    name: Coverage Upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integration-tests-nodb, integration-tests-services]
    if: |
      always() &&
      (
        needs.integration-tests-nodb.result == 'success' ||
        needs.integration-tests-services.result == 'success'
      )
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download no-services coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-nodb
          path: artifacts/nodb
        continue-on-error: true

      - name: Download services coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-services
          path: artifacts/services
        continue-on-error: true

      - name: Merge coverage profiles
        run: |
          NODB="artifacts/nodb/coverage_nodb.out"
          SERVICES="artifacts/services/coverage_services.out"

          if [ -f "$NODB" ]; then
            cp "$NODB" integration_coverage.out
          elif [ -f "$SERVICES" ]; then
            cp "$SERVICES" integration_coverage.out
          else
            echo "No coverage files found"
            exit 1
          fi

          # Append non-header lines from the services profile if it has any.
          if [ -f "$SERVICES" ]; then
            grep -v '^mode:' "$SERVICES" >> integration_coverage.out || true
          fi

      - name: Upload complete coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./integration_coverage.out
          name: codecov-umbrella
          slug: anstrom/scanorama
          flags: integration
          fail_ci_if_error: false
          verbose: true

  # Single required status check for the Main ruleset. Jobs skipped by the
  # path filter report "skipped", which passes; Coverage Upload is left out
  # so Codecov availability never blocks a merge.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - code-quality
      - swagger-drift
      - unit-tests
      - frontend-tests
      - integration-tests-nodb
      - integration-tests-services
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not succeed"
              exit 1
            fi
          done

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# PR runs share a group per branch, so a new push cancels the superseded run.
# Every other run (main, tags, schedule, dispatch) gets a unique group via
# run_id: a shared group would still cancel queued runs during merge bursts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run Go vulnerability check in source mode
        run: go tool -modfile=tools/go.mod govulncheck -mode source ./...

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          config: |
            paths-ignore:
              - "**/*_test.go"
              - "**/testdata/**"
              - "**/vendor/**"
            query-filters:
              - exclude:
                  id: go/disabled-tls-verification
              - exclude:
                  id: go/disabled-certificate-check
              - exclude:
                  id: go/insecure-tls

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Blocking: the frontend bundle ships to users, so a high or critical
      # advisory in a production dependency fails the job.
      - name: Audit frontend production dependencies
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      # Non-blocking: build and docs tooling never ships, so findings are
      # reported without failing the job. npm audit reads the lockfile, so
      # the root docs tooling needs no install.
      - name: Audit dev and docs tooling (informational)
        run: |
          npm audit --prefix frontend --audit-level=moderate || echo "::warning::Frontend dev dependency advisories found"
          npm audit --audit-level=moderate || echo "::warning::Docs tooling advisories found"

  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Check Go module licenses
        run: |
          echo "📄 Checking Go module licenses..."

          # Check licenses (allow common permissive licenses)
          go tool -modfile=tools/go.mod go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 || {
            echo "❌ License compliance check failed"
            echo "Run 'go tool -modfile=tools/go.mod go-licenses report ./...' to see all licenses"
            exit 1
          }

          echo "✅ License compliance check passed"
